name: Project CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and Agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness_pass
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://fitness:fitness_pass@localhost:5432/fitness_test
      TEST_DATABASE_URL: postgresql+asyncpg://fitness:fitness_pass@localhost:5432/fitness_test
      AGENT_QUERY_EVAL_DATABASE_URL: postgresql+asyncpg://fitness:fitness_pass@localhost:5432/fitness_test
      SECRET_KEY: test-only-secret-key-with-at-least-64-characters-0000000000000000
      PYTHONPATH: backend
      DEEPSEEK_API_KEY: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Scan public source for credential-like values
        run: python scripts/check_public_secrets.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify deterministic nutrition optimizer dependency
        run: python -c "import scipy; from scipy.optimize import milp; print(scipy.__version__, milp.__name__)"

      - name: Verify database migration upgrade and downgrade
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 0023
          python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q --tb=short --ignore=evals/tests/test_agent_tasks.py --ignore=evals/tests/test_multiturn_tasks.py --ignore=evals/tests/test_revision_tasks.py

      - name: Run deterministic Agent evaluation
        run: python backend/scripts/evaluate_agent_intents.py --mode rules --strict

      - name: Run complete synthetic Agent tasks
        run: python backend/scripts/evaluate_agent_tasks.py --split all --output artifacts/agent-task-evaluation

      - name: Run multi-turn task completion checks
        run: python backend/scripts/evaluate_multiturn_tasks.py --output artifacts/agent-multiturn-evaluation

      - name: Run proposal revision completion checks
        run: python backend/scripts/evaluate_revision_tasks.py --output artifacts/agent-revision-evaluation

      - name: Preserve Agent task results and failure inbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-task-evaluation
          path: |
            artifacts/agent-task-evaluation
            artifacts/agent-multiturn-evaluation
            artifacts/agent-revision-evaluation
          if-no-files-found: warn

      - name: Build Python 3.13 backend container
        run: >-
          docker build
          --build-arg PYTHON_IMAGE=python:3.13-slim-bookworm
          --tag fitness-agent-backend-ci:${{ github.sha }}
          backend

  miniapp:
    name: Mini program typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: miniapp/pnpm-lock.yaml

      - name: Install mini program dependencies
        working-directory: miniapp
        run: pnpm install --frozen-lockfile

      - name: Run proposal interaction contract
        working-directory: miniapp
        run: pnpm test:proposal-contract

      - name: Run WeChat build contract
        working-directory: miniapp
        run: pnpm test:build-contract

      - name: Typecheck mini program
        working-directory: miniapp
        run: pnpm typecheck

      - name: Build WeChat mini program
        working-directory: miniapp
        run: pnpm build:weapp
