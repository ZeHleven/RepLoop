name: Daily Meal Live Model Release Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to evaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: agent-live-eval
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness_pass
          POSTGRES_DB: fitness_live_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_live_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fitness:fitness_pass@localhost:5432/fitness_live_eval
      SECRET_KEY: live-eval-only-secret-key-with-at-least-64-characters-0000000000000000
      PYTHONPATH: backend
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      AGENT_ENABLED: "true"
      AGENT_INTENT_MODEL_ENABLED: "true"
    steps:
      - name: Validate requested candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "candidate_sha must be a full 40-character commit SHA" >&2
            exit 2
          fi

      - name: Check out requested release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Report evaluated revision
        id: revision
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          evaluated_sha="$(git rev-parse HEAD)"
          if [[ "${evaluated_sha}" != "${REQUESTED_SHA,,}" ]]; then
            echo "checked out SHA does not match requested candidate" >&2
            exit 2
          fi
          echo "sha=${evaluated_sha}" >> "${GITHUB_OUTPUT}"
          echo "Requested SHA: ${REQUESTED_SHA}"
          echo "Evaluated SHA: ${evaluated_sha}"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Upgrade isolated evaluation database
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Seed isolated evaluation food catalog
        working-directory: backend
        run: python scripts/seed_foods.py

      - name: Run real-model semantic route preflight
        id: route_preflight
        continue-on-error: true
        run: >-
          python backend/scripts/evaluate_agent_routing_real.py
          --strict
          --candidate-sha ${{ steps.revision.outputs.sha }}
          --output agent-route-live-eval.json

      - name: Run real-model daily meal gate twice
        id: daily_meal_gate
        continue-on-error: true
        run: >-
          python backend/scripts/evaluate_daily_meal_generation_real.py
          --strict
          --repeat 2
          --candidate-sha ${{ steps.revision.outputs.sha }}
          --output daily-meal-live-eval.json

      - name: Upload sanitized evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-meal-live-eval-${{ steps.revision.outputs.sha }}
          path: |
            agent-route-live-eval.json
            daily-meal-live-eval.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce combined live release verdict
        if: always()
        shell: bash
        env:
          ROUTE_OUTCOME: ${{ steps.route_preflight.outcome }}
          DAILY_MEAL_OUTCOME: ${{ steps.daily_meal_gate.outcome }}
        run: |
          if [[ "${ROUTE_OUTCOME}" != "success" || "${DAILY_MEAL_OUTCOME}" != "success" ]]; then
            echo "Live release gate failed: route=${ROUTE_OUTCOME}, daily_meal=${DAILY_MEAL_OUTCOME}" >&2
            exit 1
          fi
