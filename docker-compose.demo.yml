name: fitnessagent-demo
services:
  postgres:
    image: fitnessagent-postgres
    build: ./postgres
    container_name: fitnessagent-demo-postgres
    network_mode: bridge
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
      POSTGRES_DB: fitness_demo
    ports:
      - "127.0.0.1:5547:5432"
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d fitness_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  demo_postgres:
    name: fitnessagent_demo_postgres
